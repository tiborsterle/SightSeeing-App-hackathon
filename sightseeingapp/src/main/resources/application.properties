spring.application.name=sightseeingapp


spring.datasource.url=jdbc:h2:./db/hackathon_plitvice;AUTO_SERVER=True;INIT=CREATE SCHEMA IF NOT EXISTS SIGHTSEEING_APP

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/sightseeing_app_plitvice

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
