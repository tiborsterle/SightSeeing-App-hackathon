<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Nova atrakcija')}"></head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">


    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="card-title mb-4">Nova atrakcija</h2>
            <form th:action="@{/attractions-view}" th:object="${attractionViewDto}" method="post">

                <div class="mb-3">
                    <label class="form-label" for="location">Naziv mjesta</label>
                    <input class="form-control" id="location" th:field="*{location}">
                    <div class="text-danger" th:if="${#fields.hasErrors('location')}"
                         th:errors="*{location}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="name">Naziv</label>
                    <input class="form-control" id="name" th:field="*{name}">
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label pd" for="description">Opis</label>
                    <input class="form-control" id="description" th:field="*{description}">
                    <div class="text-danger" th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="type">Tip</label>
                    <select class="form-select" id="type" th:field="*{type}">
                        <option value="" disabled selected>-- Odaberite tip --</option>
                        <option th:each="t : ${types}"
                                th:value="${t.name}"
                                th:text="${t.name}">
                        </option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('type')}"
                         th:errors="*{type}"></div>
                </div>



                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/attractions-view}" class="btn btn-outline-secondary">Odustani</a>
                    <button type="submit" class="btn btn-success">Spremi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
